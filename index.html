<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sứ giả Mặt Trời</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;overflow:hidden;
 background:radial-gradient(circle at 50% 20%,#ffb703 0,#fb8500 18%,#7a3b12 55%,#2b1608 100%);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px}
/* nền đổi màu theo nút đang rê vào (chỉ đổi opacity nên nhẹ) */
.tint{position:fixed;inset:0;z-index:-1;opacity:0;transition:opacity .6s}
.t-nghi-quyet{background:radial-gradient(circle at 50% 20%,#48cae4 0,#0077b6 30%,#03045e 75%,#010221 100%)}
.t-chuyen-mon{background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 36px),repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 36px),radial-gradient(circle at 50% 20%,#4895ef 0,#1d3557 60%,#0b132b 100%)}
.t-tai-lieu{background:radial-gradient(circle at 50% 20%,#fff3b0 0,#ffc300 28%,#c77700 65%,#3d2200 100%)}
body[data-h=nghi-quyet] .t-nghi-quyet,body[data-h=chuyen-mon] .t-chuyen-mon,body[data-h=tai-lieu] .t-tai-lieu{opacity:1}
.sparks i{position:fixed;bottom:-20px;width:8px;height:8px;border-radius:50%;background:#ffe066;
 box-shadow:0 0 12px 4px rgba(255,224,102,.7);animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:.9}100%{transform:translateY(-110vh) translateX(40px);opacity:0}}
h1{font-size:clamp(1.6rem,5vw,2.6rem);text-align:center;text-shadow:0 3px 12px rgba(0,0,0,.4);animation:down .9s both}
h1 small{display:block;font-size:.4em;font-weight:400;opacity:.85;letter-spacing:3px;margin-top:4px}
@keyframes down{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
.guide{display:flex;flex-direction:column;align-items:center;animation:pop .9s .3s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.3) translateY(60px)}to{opacity:1;transform:none}}
.bubble{position:relative;background:#fff;color:#4a2a0a;padding:12px 18px;border-radius:18px;max-width:min(340px,88vw);
 text-align:center;font-weight:600;line-height:1.4;min-height:50px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-12px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}
#boy{background:#fff;border-radius:28px;padding:6px;border:4px solid #ffd60a;box-shadow:0 0 0 4px rgba(255,255,255,.35),0 10px 24px rgba(0,0,0,.4);
 width:clamp(110px,22vh,170px);margin-top:16px;cursor:pointer;animation:float 3s ease-in-out infinite;transition:transform .25s}
#boy.swap{transform:scale(.8) rotate(-6deg)}
@keyframes float{50%{transform:translateY(-10px)}}
.menu{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:150px;padding:14px 22px;cursor:pointer;
 font:inherit;font-weight:700;font-size:1.05rem;color:#fff;border-radius:18px;border:1px solid rgba(255,255,255,.45);
 background:rgba(255,255,255,.16);transition:transform .25s,background .25s,box-shadow .25s;opacity:0;animation:up .7s forwards}
.btn:nth-child(1){animation-delay:.9s}.btn:nth-child(2){animation-delay:1.1s}.btn:nth-child(3){animation-delay:1.3s}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.btn .ic{font-size:2rem;display:inline-block}
.btn[data-k=nghi-quyet] .ic{animation:compass 3.2s ease-in-out infinite}
.btn[data-k=chuyen-mon] .ic{animation:ruler 2.6s ease-in-out infinite}
.btn[data-k=tai-lieu] .ic{animation:pages 2.4s ease-in-out infinite}
.btn:hover .ic{animation-duration:.9s}
@keyframes compass{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(25deg)}}
@keyframes ruler{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-4px)}}
@keyframes pages{0%,100%{transform:translateY(0) rotate(0)}40%,60%{transform:translateY(-6px) rotate(-6deg)}50%{transform:translateY(-6px) rotate(6deg)}}
.btn:hover,.btn:focus-visible{transform:translateY(-6px) scale(1.07);background:rgba(255,255,255,.28);box-shadow:0 12px 28px rgba(0,0,0,.4),0 0 22px rgba(255,214,10,.6);outline:0}
</style>
</head>
<body>
<div class="tint t-nghi-quyet"></div><div class="tint t-chuyen-mon"></div><div class="tint t-tai-lieu"></div>
<div class="sparks" id="sparks"></div>
<h1>Sứ giả Mặt Trời<small>CHỌN HÀNH TRÌNH ÔN TẬP</small></h1>

<div class="guide">
  <div class="bubble" id="say"></div>
  <img id="boy" src="be-xin-chao.png" alt="Cậu bé hướng dẫn">
</div>

<div class="menu">
  <button class="btn" data-k="nghi-quyet" data-u="nghi-quyet.html"><span class="ic">🧭</span>Nghị quyết</button>
  <button class="btn" data-k="chuyen-mon" data-u="chuyen-mon.html"><span class="ic">📐</span>Chuyên môn</button>
  <button class="btn" data-k="tai-lieu" data-u="tai-lieu-on-tap.html"><span class="ic">📑</span>Tài liệu ôn tập</button>
</div>

<script src="hanh-trang.js"></script>
<script>
var SQ=window.SQ||{T:{},hello:function(){return 'Chào bạn! Hôm nay bạn muốn ôn phần nào?'}},T=SQ.T;
/* tải sẵn ảnh để chuyển cảnh không bị khựng */
Object.keys(T).forEach(function(k){[T[k].img,T[k].face,'be-xin-chao.png'].forEach(function(u){var i=new Image();i.src=u;if(i.decode)i.decode().catch(function(){})})});
/* hạt sáng */
var sp=document.getElementById('sparks');
for(var i=0;i<14;i++){var e=document.createElement('i');
  e.style.left=Math.random()*100+'%';e.style.animationDuration=(6+Math.random()*8)+'s';
  e.style.animationDelay=(-Math.random()*10)+'s';e.style.transform='scale('+(.5+Math.random()*1.2)+')';sp.appendChild(e)}
/* lời thoại gõ chữ, chào theo giờ */
var say=document.getElementById('say'),boy=document.getElementById('boy'),tm;
function type(t){clearTimeout(tm);say.textContent='';var i=0;(function n(){if(i<t.length){say.textContent+=t[i++];tm=setTimeout(n,25)}})()}
function face(s){boy.classList.add('swap');setTimeout(function(){boy.src=s;boy.classList.remove('swap')},120)}
var HELLO=SQ.hello();setTimeout(function(){type(HELLO)},1000);
var JOKES=['Ôn bài đi nào, mình đứng đây cổ vũ! 💪','Mỗi ngày vài câu thôi là đủ giỏi rồi 😎','Bấm thử vào mình xem 😜'];
boy.onclick=function(){face('be-co-vu.png');type(JOKES[Math.random()*JOKES.length|0]);setTimeout(function(){face('be-xin-chao.png')},2500)};
document.querySelectorAll('.btn').forEach(function(b){
  var k=b.dataset.k,t=T[k]||{};
  function over(){document.body.dataset.h=k;if(t.face){face(t.face);type(t.hov)}}
  function out(){delete document.body.dataset.h;face('be-xin-chao.png');type(HELLO)}
  b.addEventListener('mouseenter',over);b.addEventListener('focus',over);b.addEventListener('mouseleave',out);
  b.addEventListener('click',function(){
    if(window.SQ){document.body.dataset.h=k;say.textContent='Đi thôi! 🚀';SQ.go(k,boy,true)}else location.href=b.dataset.u;
  });
});
addEventListener('pageshow',function(e){if(e.persisted)location.reload()});
</script>
</body>
</html>
